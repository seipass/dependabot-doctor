name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 20
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install (no runtime dependencies)
        run: npm install --no-audit --no-fund

      # `npm test` runs `node --test "test/*.test.js"`. The quotes stop sh and
      # cmd.exe from expanding the glob, and Node only added glob support for
      # --test in v21 — so on Node 18/20 the runner got the literal string and
      # died with "Could not find 'test/*.test.js'". Running it under bash with
      # an unquoted glob expands it on every OS and every supported Node.
      - name: Test
        shell: bash
        run: node --test test/*.test.js

      - name: Lint this repository's own dependabot.yml
        run: node bin/dependabot-doctor.js . --no-color

      - name: JSON contract smoke test
        shell: bash
        run: |
          set -euo pipefail
          node bin/dependabot-doctor.js . --json > out.json
          node -e "const p=require('./out.json'); if(!Array.isArray(p.defects)||typeof p.summary.groups_total!=='number'){process.exit(1)}"
          rm -f out.json

      - name: Help and version work with no network
        run: |
          node bin/dependabot-doctor.js --help
          node bin/dependabot-doctor.js --version
